<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      font-size: 13px;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      padding: 14px 16px;
      border-bottom: 1px solid #21262d;
    }
    .header h1 { font-size: 16px; font-weight: 700; color: #58a6ff; letter-spacing: 0.5px; }
    .header h1 .ghost { opacity: 0.5; }
    .header p { font-size: 10px; color: #8b949e; margin-top: 3px; }

    /* Main */
    .main { padding: 12px; }

    /* Step cards */
    .step-card {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: border-color 0.2s;
    }
    .step-card.done { border-color: #238636; background: #161b22; }
    .step-card.active { border-color: #d2991d; background: #1a120b; }
    .step-card.waiting { opacity: 0.5; }

    .step-num {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
      flex-shrink: 0;
    }
    .step-num.pending { background: #21262d; color: #8b949e; }
    .step-num.done { background: #238636; color: #fff; }
    .step-num.active { background: #d2991d; color: #000; animation: pulse 1.5s infinite; }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(210, 153, 29, 0.4); }
      50% { box-shadow: 0 0 0 6px rgba(210, 153, 29, 0); }
    }

    .step-info { flex: 1; min-width: 0; }
    .step-label { font-size: 12px; font-weight: 600; }
    .step-desc { font-size: 10px; color: #8b949e; margin-top: 2px; }
    .step-selector {
      font-size: 9px; font-family: "SF Mono", "Fira Code", monospace;
      color: #58a6ff; margin-top: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .send-tabs { display:flex; gap:4px; margin-top:6px; }
    .send-tab { border:1px solid #30363d; background:#21262d; color:#8b949e; border-radius:4px; padding:4px 6px; font-size:10px; cursor:pointer; }
    .send-tab.active { border-color:#58a6ff; color:#58a6ff; background:#0d1f32; }

    .step-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .step-btn:active { transform: scale(0.95); }
    .btn-record { background: #d2991d; color: #000; }
    .btn-record:hover { background: #e3a82b; }
    .btn-record:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-done { background: #21262d; color: #8b949e; cursor: default; }
    .btn-redo { background: #21262d; color: #8b949e; }
    .btn-redo:hover { background: #30363d; color: #c9d1d9; }

    /* Section */
    .section { margin-top: 10px; }
    .section-title {
      font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
      color: #8b949e; margin-bottom: 6px;
    }

    /* Conversations */
    .conv-list { max-height: 180px; overflow-y: auto; }
    .conv-item {
      padding: 8px; margin-bottom: 4px;
      background: #161b22; border-radius: 6px;
      border-left: 2px solid #30363d;
      font-size: 11px;
    }
    .conv-user { color: #f0883e; font-weight: 600; }
    .conv-assistant { color: #7ee787; font-weight: 600; margin-top: 4px; }
    .conv-text {
      color: #8b949e; margin: 2px 0;
      max-height: 32px; overflow: hidden;
      line-height: 1.4;
    }
    .conv-meta { font-size: 9px; color: #484f58; }

    /* Action row */
    .action-row { display: flex; gap: 8px; margin-top: 10px; }
    .btn-action {
      flex: 1; padding: 8px; border-radius: 6px; border: none;
      font-size: 11px; font-weight: 600; cursor: pointer;
    }
    .btn-export { background: #238636; color: #fff; }
    .btn-export:hover { background: #2ea043; }
    .btn-export:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-reset { background: #21262d; color: #f85149; }
    .btn-reset:hover { background: #30363d; }
    .btn-clear { background: #21262d; color: #8b949e; }
    .btn-clear:hover { background: #30363d; }

    /* Status bar */
    .status-bar {
      text-align: center; padding: 6px; border-radius: 6px;
      font-size: 10px; margin-bottom: 10px;
    }
    .status-idle { background: #161b22; color: #484f58; }
    .status-recording { background: #1a120b; color: #d2991d; }
    .status-ready { background: #0d1f16; color: #3fb950; }

    /* Profile lifecycle */
    .profile-status { margin-bottom: 10px; }
    .profile-status-card {
      background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 10px 12px;
    }
    .profile-status-heading { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:10px; color:#8b949e; text-transform:uppercase; letter-spacing:.6px; }
    .profile-state-badge { color:#58a6ff; text-transform:none; letter-spacing:0; font-weight:600; text-align:right; }
    .profile-status-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px 12px; margin-top:9px; }
    .profile-status-grid dt { color:#8b949e; font-size:9px; }
    .profile-status-grid dd { color:#c9d1d9; font-size:10px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .profile-status-reasons { border-top:1px solid #21262d; margin-top:9px; padding-top:7px; color:#8b949e; font-size:9px; line-height:1.4; word-break:break-word; }
    .profile-status-reasons code { color:#f0883e; font:9px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .profile-verify-row { display:flex; justify-content:flex-end; margin-top:8px; }
    .profile-verify-row .mini-btn:disabled { opacity:.45; cursor:not-allowed; }

    .recording-route-card {
      background: #161b22; border: 1px solid #30363d; border-radius: 8px;
      padding: 10px 12px; margin-bottom: 10px;
    }
    .recording-route-heading { display:flex; justify-content:space-between; gap:8px; align-items:center; }
    .recording-route-title { font-size:10px; color:#8b949e; text-transform:uppercase; letter-spacing:.6px; }
    .recording-route-status { margin-top:7px; color:#c9d1d9; font-size:10px; line-height:1.4; word-break:break-word; }
    .recording-route-target { margin-top:4px; color:#58a6ff; font:9px ui-monospace, SFMono-Regular, Menlo, monospace; word-break:break-all; }

    .empty { text-align: center; padding: 16px; color: #484f58; font-size: 11px; }

    /* 模型选择 */
    .model-row {
      display: flex; gap: 6px; align-items: center; margin-top: 6px;
    }
    .model-label {
      font-size: 10px; color: #8b949e; flex: none; white-space: nowrap;
    }
    .backend-row { display:flex; gap:6px; align-items:center; }
    .backend-row .text-input { min-width:0; }
    .backend-status { color:#8b949e; font-size:9px; margin-top:4px; min-height:12px; }

    .debug-actions { display: flex; gap: 6px; margin-bottom: 6px; }
    .mini-btn { border: 1px solid #30363d; background: #21262d; color: #8b949e; border-radius: 4px; padding: 3px 7px; font-size: 10px; cursor: pointer; }
    .mini-btn:hover { background: #30363d; color: #c9d1d9; }
    .debug-log { max-height: 180px; overflow: auto; white-space: pre-wrap; word-break: break-word; background: #010409; border: 1px solid #21262d; border-radius: 5px; padding: 7px; color: #8b949e; font: 9px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; }

    .footer {
      text-align: center; padding: 8px; font-size: 9px; color: #30363d;
      border-top: 1px solid #21262d;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>👻 <span class="ghost">Phantom</span> Relay</h1>
    <p>单步录制 · 全球 AI 对话搬运</p>
  </div>

  <div class="main">
    <!-- Status -->
    <div id="statusBar" class="status-bar status-idle">等待录制</div>

    <!-- Recorded page route -->
    <section class="recording-route-card" aria-labelledby="recordingRouteTitle">
      <div class="recording-route-heading">
        <div id="recordingRouteTitle" class="recording-route-title">录制页面</div>
        <button id="btnOpenRecordingPage" class="mini-btn" type="button">打开录制页</button>
      </div>
      <div id="recordingRouteStatus" class="recording-route-status">正在检查当前页面…</div>
      <div id="recordingRouteTarget" class="recording-route-target"></div>
    </section>

    <!-- Recorded profile lifecycle status -->
    <section id="profileStatusSection" class="section profile-status" aria-labelledby="profileStatusTitle">
      <div id="profileStatusPanel" aria-live="polite">
        <div class="profile-status-card">
          <div class="profile-status-heading"><span id="profileStatusTitle">Profile 生命周期</span><span class="profile-state-badge">未加载</span></div>
        </div>
      </div>
      <div class="profile-verify-row">
        <button id="btnReverify" class="mini-btn" type="button">重新验证</button>
      </div>
    </section>

    <!-- Backend endpoint -->
    <section class="section" aria-labelledby="backendTitle">
      <div id="backendTitle" class="section-title">🔌 后端连接</div>
      <div class="backend-row">
        <input id="backendUrl" class="text-input" type="url" placeholder="http://localhost:8765" autocomplete="off" spellcheck="false" />
        <button id="btnSaveBackend" class="mini-btn" type="button">保存</button>
      </div>
      <div id="backendStatus" class="backend-status" aria-live="polite"></div>
    </section>

    <!-- Step 1: Input -->
    <div id="stepInput" class="step-card">
      <div id="step1Num" class="step-num pending">1</div>
      <div class="step-info">
        <div class="step-label">输入框</div>
        <div class="step-desc">页面会框出候选，移动鼠标查看后点击输入框</div>
        <div id="selInput" class="step-selector"></div>
      </div>
      <button id="btnInput" class="step-btn btn-record" data-role="input">⏺ 录制</button>
    </div>

    <!-- Step 2: Send strategy -->
    <div id="stepSend" class="step-card waiting">
      <div id="step2Num" class="step-num pending">2</div>
      <div class="step-info">
        <div class="step-label">发送方式</div>
        <div class="step-desc">默认回车；选择按钮时页面会框出发送候选</div>
        <div class="send-tabs" role="tablist">
          <button id="tabShortcut" class="send-tab" data-send-kind="shortcut">快捷键</button>
          <button id="tabEnter" class="send-tab active" data-send-kind="enter">回车</button>
          <button id="tabButton" class="send-tab" data-send-kind="button">发送按钮</button>
        </div>
        <div id="selSend" class="step-selector"></div>
      </div>
      <button id="btnSend" class="step-btn btn-record" data-role="send_strategy" disabled>⏺ 录制</button>
    </div>

    <!-- Step 3: Response anchor -->
    <div id="stepCopy" class="step-card waiting">
      <div id="step3Num" class="step-num pending">3</div>
      <div class="step-info">
        <div id="responseStepLabel" class="step-label">回复区域</div>
        <div id="responseStepDesc" class="step-desc">页面会框出候选；优先点击一条已完成回复正文</div>
        <div id="selCopy" class="step-selector"></div>
      </div>
      <button id="btnCopy" class="step-btn btn-record" data-role="response" disabled>⏺ 录制</button>
    </div>

    <!-- Auto Capture -->
    <div id="captureSection" class="section" style="display:none">
      <div class="section-title">🤖 自动抓取</div>
      <div class="input-row">
        <input id="msgInput" class="text-input" placeholder="输入要发送的消息..." />
        <button id="btnCapture" class="step-btn btn-record" style="flex:none;padding:8px 14px">▶ 抓取</button>
      </div>
      <div class="model-row">
        <label class="model-label">模型：</label>
        <input id="modelName" class="text-input" list="modelDatalist" placeholder="model alias (bind it to a recorded site)" style="font-size:10px;padding:5px 8px;width:100%" />
        <datalist id="modelDatalist"></datalist>
      </div>
      <div id="captureStatus" style="font-size:10px;color:#8b949e;margin-top:4px"></div>
    </div>

    <!-- Debug Log -->
    <div id="debugSection" class="section">
      <div class="section-title">🧪 实时诊断日志</div>
      <div class="debug-actions">
        <button id="btnCopyLog" class="mini-btn">复制日志</button>
        <button id="btnClearLog" class="mini-btn">清空</button>
      </div>
      <pre id="debugLog" class="debug-log">等待自动抓取...</pre>
    </div>

    <!-- Raw Page Trace -->
    <div id="pageTraceSection" class="section">
      <div class="section-title">🧬 原始页面变化（DOM Trace）</div>
      <div class="debug-actions">
        <button id="btnCopyPageTrace" class="mini-btn">复制页面日志</button>
        <button id="btnClearPageTrace" class="mini-btn">清空</button>
      </div>
      <pre id="pageTraceLog" class="debug-log">等待页面变化...</pre>
    </div>

    <!-- Conversations -->
    <div class="section" id="convSection" style="display:none">
      <div class="section-title">💬 对话记录 (<span id="convCount">0</span>)</div>
      <div id="convList" class="conv-list"></div>
    </div>

    <!-- Actions -->
    <div class="action-row">
      <button id="btnExport" class="btn-action btn-export" disabled>📦 导出 JSON</button>
      <button id="btnSendServer" class="btn-action btn-export" disabled>📡 发送到 API</button>
    </div>
    <div class="action-row">
      <button id="btnReset" class="btn-action btn-reset">🔄 重置录制</button>
      <button id="btnClear" class="btn-action btn-clear">🗑 清除对话</button>
    </div>
  </div>

  <div class="footer" title="正在读取扩展运行版本…">正在读取扩展版本 · Phantom Relay</div>

  <script src="profile_contract.js"></script>
  <script src="popup_profile_status.js"></script>
  <script src="popup_profile_contract.js"></script>
  <script src="popup.js"></script>
</body>
</html>
