<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Test: Enter Send</title>
<style>
body{font-family:system-ui;max-width:700px;margin:40px auto;padding:20px;background:#111;color:#ddd}
#chat{min-height:300px;border:1px solid #333;border-radius:8px;padding:16px;margin-bottom:16px;background:#1a1a1a;overflow-y:auto;max-height:400px}
.msg{margin:8px 0;padding:8px 12px;border-radius:8px;max-width:80%}
.msg.user{background:#2563eb;color:#fff;margin-left:auto;text-align:right}
.msg.assistant{background:#333;color:#ccc}
textarea{width:100%;padding:12px;border:1px solid #444;border-radius:8px;background:#222;color:#ddd;font-size:14px;resize:none;box-sizing:border-box}
</style></head>
<body>
<div id="chat"></div>
<textarea id="messageInput" rows="2" placeholder="Type your message and press Enter..."></textarea>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('messageInput');
let msgSeq = 0;
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    msgSeq++;
    const userDiv = document.createElement('div');
    userDiv.className = 'msg user';
    userDiv.setAttribute('data-message-id', 'msg-' + msgSeq);
    userDiv.setAttribute('data-observe-row', 'row-' + msgSeq);
    userDiv.textContent = text;
    chat.appendChild(userDiv);
    input.value = '';
    input.dispatchEvent(new Event('input', {bubbles:true}));
    input.dispatchEvent(new Event('change', {bubbles:true}));
    // Simulate streaming AI response
    msgSeq++;
    const aiDiv = document.createElement('div');
    aiDiv.className = 'msg assistant';
    aiDiv.setAttribute('data-message-id', 'msg-' + msgSeq);
    aiDiv.setAttribute('data-observe-row', 'row-' + msgSeq);
    aiDiv.textContent = '...';
    chat.appendChild(aiDiv);
    const response = `AI response to: "${text}" — this is a simulated streaming answer that appears after 1 second.`;
    let idx = 0;
    const streamInterval = setInterval(() => {
      if (idx < response.length) {
        aiDiv.textContent = response.substring(0, idx + 1);
        idx++;
      } else {
        clearInterval(streamInterval);
        aiDiv.setAttribute('data-streaming', 'false');
      }
    }, 20);
    chat.scrollTop = chat.scrollHeight;
  }
});
</script>
</body>
</html>
