<!doctype html>
<main data-chat-root>
  <textarea id="prompt"></textarea>
  <div class="chat-row" data-message-id="assistant-1" data-role="assistant">
    <p class="answer-body">Previous answer</p>
  </div>
  <script>
    (() => {
      let turn = 1;
      const input = document.querySelector('#prompt');
      const root = document.querySelector('[data-chat-root]');

      input.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter' || event.isComposing) return;
        event.preventDefault();
        const text = String(input.value || '').trim();
        if (!text) return;
        input.value = '';
        turn += 1;

        const row = document.createElement('div');
        row.className = 'chat-row last';
        const identity = document.createElement('div');
        identity.className = 'answer-box';
        identity.dataset.messageId = `assistant-${turn}`;
        identity.dataset.streaming = 'true';
        identity.setAttribute('aria-busy', 'true');
        const answer = document.createElement('p');
        answer.className = 'answer-body';
        answer.textContent = 'Echo:';
        identity.appendChild(answer);
        row.appendChild(identity);
        root.appendChild(row);

        setTimeout(() => {
          answer.textContent = `Echo: ${text}`;
        }, 100);
        setTimeout(() => {
          delete identity.dataset.streaming;
          identity.removeAttribute('aria-busy');
        }, 250);
      });
    })();
  </script>
</main>
