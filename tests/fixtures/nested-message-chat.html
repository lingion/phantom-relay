<!doctype html>
<main data-chat-root>
  <textarea id="prompt" aria-label="Message"></textarea>
  <button id="send" type="button">Send</button>
  <div data-message-id="assistant-1" data-role="assistant">
    <div data-message-body>
      <p>Previous <strong>nested answer</strong></p>
    </div>
    <div data-action="copy" aria-hidden="true">copy</div>
  </div>
  <script>
    (() => {
      let turn = 1;
      const input = document.querySelector('#prompt');
      const send = document.querySelector('#send');
      const root = document.querySelector('[data-chat-root]');

      send.addEventListener('click', () => {
        const text = String(input.value || '').trim();
        if (!text) return;
        input.value = '';
        turn += 1;

        const user = document.createElement('div');
        user.dataset.messageId = `user-${turn}`;
        user.dataset.role = 'user';
        user.innerHTML = `<div data-message-body></div>`;
        user.querySelector('[data-message-body]').textContent = text;
        root.appendChild(user);

        const assistant = document.createElement('div');
        assistant.dataset.messageId = `assistant-${turn}`;
        assistant.dataset.role = 'assistant';
        assistant.dataset.streaming = 'true';
        assistant.setAttribute('aria-busy', 'true');
        assistant.innerHTML = '<div data-message-body>Echo:</div><div data-action="copy" aria-hidden="true">copy</div>';
        root.appendChild(assistant);

        setTimeout(() => {
          assistant.querySelector('[data-message-body]').textContent = `Echo: ${text}`;
        }, 100);
        setTimeout(() => {
          delete assistant.dataset.streaming;
          assistant.removeAttribute('aria-busy');
        }, 250);
      });
    })();
  </script>
</main>
